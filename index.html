<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFT Gifts Showcase</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #12121c);
  color: white;
}

.header {
  text-align: center;
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.sub {
  text-align: center;
  opacity: 0.7;
  margin-bottom: 20px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: #1f1f2e;
  border-radius: 16px;
  padding: 12px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  background: #29293d;
}

.card img {
  width: 100%;
  border-radius: 12px;
}

.title {
  margin: 10px 0;
  font-weight: bold;
}

.btn {
  background: #2ea6ff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  width: 100%;
}

.btn:hover {
  background: #1b8edb;
}
</style>
</head>

<body>

<div class="header">🎁 NFT Gifts</div>
<div class="sub">Откройте подарок и приобретите его в Telegram</div>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x200" />
    <div class="title">NFT Gift #001</div>
    <button class="btn"
      onclick="window.open('https://t.me/nft', '_blank')">
      Купить
    </button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" />
    <div class="title">NFT Gift #002</div>
    <button class="btn"
      onclick="window.open('https://t.me/nft', '_blank')">
      Купить
    </button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" />
    <div class="title">NFT Gift #003</div>
    <button class="btn"
      onclick="window.open('https://t.me/nft', '_blank')">
      Купить
    </button>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFT Gifts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f10;
    color: white;
}

.header {
    padding: 16px;
    font-size: 22px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 12px;
}

.card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="header">🎁 NFT Подарки</div>

<div class="grid">
    <div class="card">
        <img src="https://via.placeholder.com/200" />
        <div>Ice Cream</div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200" />
        <div>Holiday Drink</div>
    </div>
</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Gifts</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .cat {
      background: #1e293b;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat:hover {
      background: #334155;
      transform: scale(1.03);
    }

    .gifts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .btn {
      margin-top: 8px;
      background: #22c55e;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #16a34a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎁 NFT Gifts</h1>

    <div class="categories">
      <div class="cat">🎁 Все</div>
      <div class="cat">💎 Редкие</div>
      <div class="cat">🔥 Новые</div>
      <div class="cat">🎉 Праздничные</div>
    </div>

    <div class="gifts">
      <div class="card">
        <img src="https://via.placeholder.com/300x200" />
        <div>Ice Cream NFT</div>
        <div class="card">
  <img src="https://via.placeholder.com/300x200" />
  <div>Durov’s Cap #2633</div>
  <button class="btn"
    onclick="window.open('https://t.me/nft', '_blank')">
    Купить
  </button>
</div>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x200" />
        <div>Holiday Drink NFT</div>
        <button class="btn"
  onclick="window.open('https://t.me/nft', '_blank')">
  Купить
</button>
      </div>
    </div>
  </div>

  <script>
const tg = window.Telegram.WebApp;
  tg.expand();
</script>
    const tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFT Gifts Showcase</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f14;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

.card {
    background: #1c1c24;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 80px;
    margin-bottom: 10px;
}

.btn {
    background: #2a2aff;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
}

.btn:hover {
    background: #4444ff;
}
</style>
</head>

<body>

<header>🎁 NFT Gifts Marketplace</header>

<div class="grid">

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616490.png">
    <h3>Durov Cap</h3>
    <button class="btn" onclick="openMarket()">Купить</button>
</div>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/2917/2917995.png">
    <h3>Crypto Bear</h3>
    <button class="btn" onclick="openMarket()">Купить</button>
</div>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <h3>Diamond Gift</h3>
    <button class="btn" onclick="openMarket()">Купить</button>
</div>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png">
    <h3>Golden Box</h3>
    <button class="btn" onclick="openMarket()">Купить</button>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function openMarket() {
    Telegram.WebApp.openTelegramLink('tg://resolve?domain=nft');
}
</script>

</body>
</html>
